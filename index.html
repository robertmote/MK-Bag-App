<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mary Katherine — Luxury Bag Value Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-row">
        <div class="sb-logo-icon"><i class="ti ti-briefcase"></i></div>
        <div>
          <div class="sb-logo-name" id="sb-appname">Mary Katherine</div>
          <div class="sb-logo-sub">Value Tracker</div>
        </div>
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-lbl">Overview</div>
      <button type="button" class="nav-item" data-page="dashboard"><i class="ti ti-layout-dashboard"></i> Dashboard</button>
      <button type="button" class="nav-item" data-page="collection"><i class="ti ti-briefcase"></i> My collection</button>
      <button type="button" class="nav-item" data-page="trends"><i class="ti ti-chart-line"></i> Market trends</button>
    </div>
    <div class="nav-section">
      <div class="nav-lbl">Manage</div>
      <button type="button" class="nav-item" data-page="add-bag"><i class="ti ti-plus"></i> Add a bag</button>
      <button type="button" class="nav-item" data-page="reports"><i class="ti ti-file-text"></i> Reports</button>
      <button type="button" class="nav-item" data-page="alerts"><i class="ti ti-bell"></i> Price alerts</button>
      <button type="button" class="nav-item" data-page="wishlist"><i class="ti ti-bookmark"></i> Wishlist</button>
    </div>
    <div class="nav-section">
      <div class="nav-lbl">Account</div>
      <button type="button" class="nav-item" data-page="settings"><i class="ti ti-settings"></i> Settings</button>
    </div>
    <div class="sb-footer">
      <div class="user-pill" role="button" tabindex="0" aria-label="Settings" data-action="go" data-arg="settings">
        <div class="avatar" id="sb-avatar">SC</div>
        <div style="flex:1;min-width:0">
          <div class="text-12 f500 c-deepest nowrap" id="sb-name">Mary Katherine</div>
          <div class="text-11 c-dark" id="sb-plan">Pro plan</div>
        </div>
        <i class="ti ti-dots-vertical" style="font-size:16px;color:#993556"></i>
      </div>
    </div>
  </nav>
  <div id="main"></div>
</div>
<div id="toast" class="flex items-center gap-10" role="status" aria-live="polite">
  <i class="ti ti-circle-check" style="font-size:16px"></i>
  <span id="toast-msg"></span>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
